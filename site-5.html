<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ورود به پنل کاربری</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#0a2bff;--red:#e00000;--text:#fff;--bd:rgba(255,255,255,.3);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:'Vazirmatn',Tahoma,sans-serif;color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 14px;overflow-x:hidden;background:linear-gradient(to left,#0b1fcf 0%,#1d1fb5 22%,#4b17a0 40%,#7a1090 50%,#a50a55 60%,#bb0420 78%,#c00000 100%)}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 85% 20%,rgba(30,70,255,.7) 0,transparent 50%),radial-gradient(circle at 15% 80%,rgba(255,20,20,.6) 0,transparent 50%),radial-gradient(circle at 50% 50%,rgba(120,15,150,.75) 0,transparent 62%)}
.wrap{width:100%;max-width:640px;text-align:center}
h1{font-size:clamp(22px,5vw,32px);font-weight:800;margin-bottom:6px;text-shadow:0 2px 14px rgba(0,0,0,.4)}
.sub{color:#e6e9ff;font-size:14px;margin-bottom:28px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.box{padding:26px 12px 20px;border-radius:24px;border:1px solid var(--bd);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;gap:16px;transition:.25s}
.box:hover{transform:translateY(-4px)}
.b{background:linear-gradient(160deg,rgba(10,43,255,.55),rgba(5,15,110,.4));box-shadow:0 10px 36px rgba(10,43,255,.55),inset 0 1px 0 rgba(255,255,255,.4)}
.r{background:linear-gradient(160deg,rgba(224,0,0,.55),rgba(100,0,0,.4));box-shadow:0 10px 36px rgba(224,0,0,.55),inset 0 1px 0 rgba(255,255,255,.4)}
.av{width:104px;height:104px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.55)}
.b .av{width:104px;height:104px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.55)}
.r .av{width:104px;height:104px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.55)}
.name{font-size:clamp(17px,4.4vw,24px);font-weight:800;line-height:1.6;min-height:3.2em;display:flex;align-items:center}
.btn{width:100%;color:#fff;font:600 clamp(12px,3.2vw,15px) 'Vazirmatn',Tahoma,sans-serif;padding:12px 6px;border-radius:30px;cursor:pointer;border:1px solid var(--bd);background:rgba(255,255,255,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 6px 18px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.5);transition:.2s}
.btn:hover{background:rgba(255,255,255,.3);transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,120px);padding:14px 24px;z-index:20;transition:.4s;background:rgba(20,10,60,.8);border:1px solid var(--bd);border-radius:20px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:14px;white-space:nowrap}
#toast.s{transform:translate(-50%,0)}
</style>
</head>
